<svg viewBox="0 0 700 455" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="455" fill="#ffffff"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">GPU cold vs warm time @ 2048×2048 px (M4 Pro)</text>

  <!-- Legend (single row, clears the plot which starts at y=60) -->
  <rect x="139" y="40" width="14" height="14" fill="#1e3a8a"/>
  <text x="159" y="51" font-size="12" fill="#374151">Cold — first run (one-time setup)</text>
  <rect x="392" y="40" width="14" height="14" fill="#60a5fa"/>
  <text x="412" y="51" font-size="12" fill="#374151">Warm — every run after</text>

  <!-- gridlines + y ticks: 0,5,10,15,20,25 at 12.8 px/s, baseline y=380 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="380" x2="640" y2="380"/>
    <line x1="90" y1="316" x2="640" y2="316"/>
    <line x1="90" y1="252" x2="640" y2="252"/>
    <line x1="90" y1="188" x2="640" y2="188"/>
    <line x1="90" y1="124" x2="640" y2="124"/>
    <line x1="90" y1="60"  x2="640" y2="60"/>
  </g>
  <g font-size="10" fill="#6b7280" text-anchor="end">
    <text x="84" y="384">0</text>
    <text x="84" y="320">5</text>
    <text x="84" y="256">10</text>
    <text x="84" y="192">15</text>
    <text x="84" y="128">20</text>
    <text x="84" y="64">25</text>
  </g>
  <text x="34" y="220" font-size="11" fill="#6b7280" transform="rotate(-90 34 220)" text-anchor="middle">seconds · lower is better</text>
  <line x1="90" y1="60" x2="90" y2="380" stroke="#9ca3af" stroke-width="1"/>

  <!-- Cold bars (dark blue) -->
  <g fill="#1e3a8a">
    <rect x="125.8" y="373.6" width="30" height="6.4"/>
    <rect x="263.3" y="351.6" width="30" height="28.4"/>
    <rect x="400.8" y="291.4" width="30" height="88.6"/>
    <rect x="538.3" y="116.2" width="30" height="263.8"/>
  </g>
  <!-- Warm bars (light blue) -->
  <g fill="#60a5fa">
    <rect x="161.8" y="374.4" width="30" height="5.6"/>
    <rect x="299.3" y="353.1" width="30" height="26.9"/>
    <rect x="436.8" y="296.3" width="30" height="83.7"/>
    <rect x="574.3" y="151.1" width="30" height="228.9"/>
  </g>
  <!-- value labels -->
  <g font-size="10" fill="#374151" text-anchor="middle">
    <text x="140.8" y="370">0.50</text><text x="176.8" y="371">0.44</text>
    <text x="278.3" y="348">2.22</text><text x="314.3" y="350">2.10</text>
    <text x="415.8" y="288">6.92</text><text x="451.8" y="293">6.54</text>
    <text x="553.3" y="113">20.6</text><text x="589.3" y="148">17.9</text>
  </g>
  <!-- x labels -->
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="158.75" y="397">50</text>
    <text x="296.25" y="397">150</text>
    <text x="433.75" y="397">300</text>
    <text x="571.25" y="397">500</text>
  </g>
  <text x="350" y="416" text-anchor="middle" font-size="11" fill="#6b7280">images compared (all-pairs)</text>

  <text x="350" y="442" text-anchor="middle" font-size="11" fill="#111827">Compile cost is paid once per launch — warm is what a working session feels like.</text>
</svg>
