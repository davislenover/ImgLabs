<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">ImgLabs ZNCC — GPU vs 14-Core CPU @ 2048×2048 px (M4 Pro, After Items 1–2)</text>

  <!-- Legend -->
  <rect x="330" y="38" width="14" height="14" fill="#2f6fed"/>
  <text x="350" y="50" font-size="12" fill="#374151">GPU (Metal, 20-Core)</text>
  <rect x="500" y="38" width="14" height="14" fill="#e8833a"/>
  <text x="520" y="50" font-size="12" fill="#374151">CPU (14-Core, Best of 3)</text>

  <!-- ================= Panel A: Time ================= -->
  <text x="265" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Warm Compute Time (s) · Lower Is Better</text>
  <!-- gridlines + y ticks: 0,5,10,15,20,25 at 12.8 px/s, baseline y=380 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="380" x2="440" y2="380"/>
    <line x1="90" y1="316" x2="440" y2="316"/>
    <line x1="90" y1="252" x2="440" y2="252"/>
    <line x1="90" y1="188" x2="440" y2="188"/>
    <line x1="90" y1="124" x2="440" y2="124"/>
    <line x1="90" y1="60"  x2="440" y2="60"/>
  </g>
  <g font-size="10" fill="#6b7280" text-anchor="end">
    <text x="84" y="384">0</text>
    <text x="84" y="320">5</text>
    <text x="84" y="256">10</text>
    <text x="84" y="192">15</text>
    <text x="84" y="128">20</text>
    <text x="84" y="64">25</text>
  </g>
  <line x1="90" y1="60" x2="90" y2="380" stroke="#9ca3af" stroke-width="1"/>

  <!-- GPU bars (blue) -->
  <g fill="#2f6fed">
    <rect x="111" y="374.4" width="22" height="5.6"/>
    <rect x="198" y="353.1" width="22" height="26.9"/>
    <rect x="285" y="296.3" width="22" height="83.7"/>
    <rect x="372" y="151.1" width="22" height="228.9"/>
  </g>
  <!-- CPU bars (orange) -->
  <g fill="#e8833a">
    <rect x="137" y="376.3" width="22" height="3.7"/>
    <rect x="224" y="350.4" width="22" height="29.6"/>
    <rect x="311" y="264.9" width="22" height="115.1"/>
    <rect x="398" y="64.6"  width="22" height="315.4"/>
  </g>
  <!-- value labels -->
  <g font-size="9" fill="#374151" text-anchor="middle">
    <text x="122" y="371">0.44</text><text x="148" y="373">0.29</text>
    <text x="209" y="350">2.1</text><text x="235" y="347">2.3</text>
    <text x="296" y="293">6.5</text><text x="322" y="262">9.0</text>
    <text x="383" y="148">17.9</text><text x="409" y="61">24.6</text>
  </g>
  <!-- x labels -->
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="135" y="396">50</text>
    <text x="222" y="396">150</text>
    <text x="309" y="396">300</text>
    <text x="396" y="396">500</text>
  </g>
  <text x="265" y="416" text-anchor="middle" font-size="11" fill="#6b7280">Images Compared (All-Pairs)</text>

  <!-- ================= Panel B: Memory ================= -->
  <text x="735" y="76" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Peak Memory (GB) · Lower Is Better</text>
  <!-- gridlines + y ticks: 0,12,24,36,48 at 6.667 px/GB -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="560" y1="380" x2="910" y2="380"/>
    <line x1="560" y1="300" x2="910" y2="300"/>
    <line x1="560" y1="220" x2="910" y2="220"/>
    <line x1="560" y1="140" x2="910" y2="140"/>
  </g>
  <g font-size="10" fill="#6b7280" text-anchor="end">
    <text x="554" y="384">0</text>
    <text x="554" y="304">12</text>
    <text x="554" y="224">24</text>
    <text x="554" y="144">36</text>
  </g>
  <line x1="560" y1="60" x2="910" y2="60" stroke="#d64545" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="906" y="55" text-anchor="end" font-size="10" font-weight="600" fill="#d64545">48 GB Unified RAM</text>
  <line x1="560" y1="60" x2="560" y2="380" stroke="#9ca3af" stroke-width="1"/>

  <!-- GPU bars -->
  <g fill="#2f6fed">
    <rect x="581" y="347.3" width="22" height="32.7"/>
    <rect x="668" y="291.3" width="22" height="88.7"/>
    <rect x="755" y="206.5" width="22" height="173.5"/>
    <rect x="842" y="92.7"  width="22" height="287.3"/>
  </g>
  <!-- CPU bars -->
  <g fill="#e8833a">
    <rect x="607" y="350.9" width="22" height="29.1"/>
    <rect x="694" y="338.9" width="22" height="41.1"/>
    <rect x="781" y="301.2" width="22" height="78.8"/>
    <rect x="868" y="250.7" width="22" height="129.3"/>
  </g>
  <g font-size="9" fill="#374151" text-anchor="middle">
    <text x="592" y="344">4.9</text><text x="618" y="347">4.4</text>
    <text x="679" y="288">13.3</text><text x="705" y="335">6.2</text>
    <text x="766" y="203">26.0</text><text x="792" y="298">11.8</text>
    <text x="853" y="89">43.1</text><text x="879" y="247">19.4</text>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="605" y="396">50</text>
    <text x="692" y="396">150</text>
    <text x="779" y="396">300</text>
    <text x="866" y="396">500</text>
  </g>
  <text x="735" y="416" text-anchor="middle" font-size="11" fill="#6b7280">Images Compared (All-Pairs)</text>

  <!-- Takeaway strip -->
  <text x="480" y="444" text-anchor="middle" font-size="12" fill="#111827">GPU overtakes the 14-core CPU from ~150 images, and its peak memory stays under RAM through 500 images (~43 GB).</text>
</svg>
